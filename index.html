<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RuneQuest 2D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Cinzel', 'Trebuchet MS', sans-serif; }
  body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; color: #fff; }
  #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #151d18; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

  #top-bar {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10;
  }
  .hud-badge {
    pointer-events: auto; background: rgba(18, 16, 12, 0.9);
    border: 2px solid #5d462b; border-radius: 6px; padding: 6px 12px;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  }

  #chat-container {
    position: absolute; bottom: 12px; left: 12px; width: 300px; height: 120px;
    background: rgba(10, 8, 6, 0.85); border: 2px solid #4a3720; border-radius: 8px;
    display: flex; flex-direction: column; z-index: 15; overflow: hidden;
  }
  #chat-messages { flex: 1; padding: 6px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
  .msg { color: #d0c0a0; }
  .msg.system { color: #ffff00; }
  .msg.error { color: #ff4444; }
  #chat-input { background: transparent; border: none; border-top: 1px solid #382816; padding: 6px; color: #fff; font-size: 11px; outline: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="top-bar">
    <div class="hud-badge">
      <span>⚔️</span>
      <span id="player-name-hud" style="color: #f0c868; font-size: 12px; font-weight: bold;">Connecting...</span>
    </div>
    <div class="hud-badge">
      <span id="connection-status" style="font-size: 11px; color: #ffaa00;">● Connecting...</span>
    </div>
  </div>

  <div id="chat-container">
    <div id="chat-messages">
      <div class="msg system">Attempting WebSocket handshake...</div>
    </div>
    <input type="text" id="chat-input" placeholder="Type chat message..." />
  </div>
</div>

<script>
const TILE_PX = 32;
const MAP_SIZE = 50;

const state = {
  playerId: null,
  players: {},
  npcs: [],
  map: [],
  popups: []
};

for (let y = 0; y < MAP_SIZE; y++) {
  const row = [];
  for (let x = 0; x < MAP_SIZE; x++) {
    let tile = 0;
    if (x === 22 || y === 22) tile = 1;
    if (x > 32 && x < 42 && y > 10 && y < 20) tile = 2;
    row.push(tile);
  }
  state.map.push(row);
}

// Connect securely on Render (wss://) or locally (ws://)
const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
const host = window.location.host || 'localhost:8080';
const socketUrl = protocol + host;

addChat(`Connecting to: ${socketUrl}`, 'system');
const socket = new WebSocket(socketUrl);

socket.onopen = () => {
  document.getElementById('connection-status').innerText = '● Connected';
  document.getElementById('connection-status').style.color = '#00ff88';
  addChat('Handshake successful! Connected to server.', 'system');
};

socket.onmessage = (event) => {
  try {
    const data = JSON.parse(event.data);
    if (data.type === 'INIT') {
      state.playerId = data.id;
      state.players = data.players || {};
      state.npcs = data.npcs || [];
      if (state.players[state.playerId]) {
        document.getElementById('player-name-hud').innerText = state.players[state.playerId].name;
      }
    } else if (data.type === 'TICK_UPDATE') {
      state.players = data.players || {};
      state.npcs = data.npcs || [];
    } else if (data.type === 'CHAT_MSG') {
      addChat(`${data.sender}: ${data.text}`);
    }
  } catch (err) {}
};

socket.onerror = (error) => {
  document.getElementById('connection-status').innerText = '● Error';
  document.getElementById('connection-status').style.color = '#ff4444';
  addChat('WebSocket error encountered. Check network/proxy.', 'error');
};

socket.onclose = (event) => {
  document.getElementById('connection-status').innerText = '● Closed';
  document.getElementById('connection-status').style.color = '#ff4444';
  addChat(`Connection closed (Code: ${event.code})`, 'error');
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

canvas.addEventListener('click', (e) => {
  if (!state.playerId || !state.players[state.playerId]) return;
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  const me = state.players[state.playerId];
  const cameraX = me.x * TILE_PX - canvas.width / 2;
  const cameraY = me.y * TILE_PX - canvas.height / 2;

  const tileX = Math.floor((clickX + cameraX) / TILE_PX);
  const tileY = Math.floor((clickY + cameraY) / TILE_PX);

  socket.send(JSON.stringify({ type: 'MOVE', x: tileX, y: tileY }));
});

document.getElementById('chat-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    socket.send(JSON.stringify({ type: 'CHAT', text: e.target.value.trim() }));
    e.target.value = '';
  }
});

function addChat(text, type = '') {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let camX = 22 * TILE_PX - canvas.width / 2;
  let camY = 22 * TILE_PX - canvas.height / 2;

  if (state.playerId && state.players[state.playerId]) {
    const me = state.players[state.playerId];
    camX = me.x * TILE_PX - canvas.width / 2;
    camY = me.y * TILE_PX - canvas.height / 2;
  }

  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const sx = x * TILE_PX - camX;
      const sy = y * TILE_PX - canvas.height / 2; // handled by standard camY below
    }
  }

  // Proper map tile render pass
  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const sx = x * TILE_PX - camX;
      const sy = y * TILE_PX - camY;

      if (sx < -TILE_PX || sx > canvas.width || sy < -TILE_PX || sy > canvas.height) continue;

      const t = state.map[y][x];
      ctx.fillStyle = t === 1 ? '#7a6343' : (t === 2 ? '#1c4966' : '#2d4c1e');
      ctx.fillRect(sx, sy, TILE_PX, TILE_PX);
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.strokeRect(sx, sy, TILE_PX, TILE_PX);
    }
  }

  if (Array.isArray(state.npcs)) {
    state.npcs.forEach(npc => {
      if (!npc.alive) return;
      const sx = npc.x * TILE_PX - camX;
      const sy = npc.y * TILE_PX - camY;
      ctx.font = '22px serif';
      ctx.fillText('👺', sx + 4, sy + 24);
    });
  }

  if (state.players) {
    Object.values(state.players).forEach(p => {
      const sx = p.x * TILE_PX - camX;
      const sy = p.y * TILE_PX - camY;

      ctx.font = '24px serif';
      ctx.fillText(p.id === state.playerId ? '⚔️' : '🧙‍♂️', sx + 4, sy + 24);

      ctx.font = '10px sans-serif';
      ctx.fillStyle = p.id === state.playerId ? '#ffff00' : '#00ffcc';
      ctx.fillText(p.name || 'Hero', sx, sy - 6);
    });
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
