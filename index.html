<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RuneQuest 2D - Connecting Wilderness</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Cinzel', 'Trebuchet MS', sans-serif;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0b0d;
  color: #fff;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: #151d18;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

#top-bar {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}

.hud-badge {
  pointer-events: auto;
  background: rgba(18, 16, 12, .9);
  border: 2px solid #5d462b;
  border-radius: 6px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .6);
}

.btn-fullscreen {
  pointer-events: auto;
  background: linear-gradient(#b91c1c, #7f1d1d);
  border: 2px solid #f87171;
  border-radius: 6px;
  color: white;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}

.btn-fullscreen:active {
  transform: scale(.95);
}

#joystick-container {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(0, 0, 0, .4);
  border: 2px solid rgba(140, 106, 60, .7);
  touch-action: none;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(4px);
}

#joystick-knob {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle, #8c6a3c, #3a2e1e);
  border: 2px solid #f3d078;
  position: absolute;
  pointer-events: none;
  box-shadow: 0 4px 8px rgba(0, 0, 0, .6);
}

#hud-tabs {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 20;
}

.tab-btn {
  width: 46px;
  height: 46px;
  background: linear-gradient(#3a2e1e, #1a140d);
  border: 2px solid #8c6a3c;
  border-radius: 8px;
  color: #f3d078;
  font-size: 20px;
  cursor: pointer;
}

.ui-window {
  position: absolute;
  width: 290px;
  max-height: 420px;
  background: rgba(22, 18, 13, .95);
  border: 3px solid #6b5233;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .8);
  display: none;
  flex-direction: column;
  z-index: 25;
  overflow: hidden;
  backdrop-filter: blur(4px);
  touch-action: none;
}

.ui-window.active {
  display: flex;
}

#char-win { bottom: 76px; right: 20px; }
#inventory-win { bottom: 76px; right: 320px; }
#shop-win { bottom: 76px; right: 620px; }

.ui-header {
  background: linear-gradient(90deg, #3d2d1b, #1e150b);
  padding: 8px 12px;
  border-bottom: 2px solid #5a4227;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  color: #f8db83;
  font-size: 13px;
  cursor: move;
}

.ui-close {
  cursor: pointer;
  color: #a88a5a;
  font-size: 16px;
}

.ui-body {
  padding: 12px;
  overflow-y: auto;
  max-height: 360px;
  font-size: 12px;
}

.equip-grid {
  display: flex;
  justify-content: space-around;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #3d2f1d;
}

.equip-slot {
  width: 48px;
  height: 48px;
  background: #120e0a;
  border: 2px solid #5a4227;
  border-radius: 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  cursor: pointer;
}

.slot-label {
  position: absolute;
  bottom: 2px;
  font-size: 8px;
  color: #a88a5a;
}

.equip-slot .item-icon { font-size: 24px; }

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #18130d;
  border: 1px solid #382816;
  padding: 6px 10px;
  border-radius: 4px;
  margin-bottom: 6px;
}

.stat-upgrade-btn {
  background: #4a3720;
  border: 1px solid #f0c868;
  color: #f0c868;
  padding: 2px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.grid-28 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.inv-slot {
  width: 100%;
  aspect-ratio: 1;
  background: #120e0a;
  border: 2px solid #3d2f1d;
  border-radius: 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  cursor: pointer;
}

.inv-slot .item-icon { font-size: 22px; }

.item-count {
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 10px;
  font-weight: bold;
  color: yellow;
}

.shop-item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #18130d;
  border: 1px solid #4a3821;
  padding: 6px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}

.shop-btn {
  background: linear-gradient(#4a3720, #22180c);
  border: 1px solid #f0c868;
  color: white;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}

#chat-container {
  position: absolute;
  bottom: 20px;
  left: 145px;
  width: 240px;
  height: 100px;
  background: rgba(10, 8, 6, .85);
  border: 2px solid #4a3720;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  z-index: 15;
  overflow: hidden;
}

#chat-messages {
  flex: 1;
  padding: 6px;
  overflow-y: auto;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.msg { color: #d0c0a0; }
.msg.system { color: yellow; }

#chat-input {
  background: transparent;
  border: none;
  border-top: 1px solid #382816;
  padding: 4px 6px;
  color: white;
  font-size: 11px;
  outline: none;
}
</style>
</head>

<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="top-bar">
    <div class="hud-badge">
      <div style="display:flex;flex-direction:column">
        <span id="player-name-hud"
          style="color:#f0c868;font-size:12px;font-weight:bold">
          Connecting...
        </span>
        <span id="player-stats-hud"
          style="color:#00ffcc;font-size:10px">
          Lvl: 3 | HP: 20/20
        </span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-fullscreen" onclick="goFullscreen()">
        📺 FULLSCREEN
      </button>
      <div class="hud-badge">
        <span id="connection-status"
          style="font-size:11px;color:#ffaa00">
          ● Connecting...
        </span>
      </div>
    </div>
  </div>

  <div id="joystick-container">
    <div id="joystick-knob"></div>
  </div>

  <div id="hud-tabs">
    <button class="tab-btn" onclick="toggleWindow('char-win')"
      title="Character & Equipment">👤</button>
    <button class="tab-btn" onclick="toggleWindow('inventory-win')"
      title="Inventory">🎒</button>
  </div>

  <div class="ui-window active" id="char-win">
    <div class="ui-header" id="char-win-header">
      <span>Character & Stats</span>
      <span class="ui-close" onclick="toggleWindow('char-win')">✕</span>
    </div>

    <div class="ui-body">
      <div style="margin-bottom:10px;display:flex;gap:6px;align-items:center">
        <span>Name:</span>
        <input type="text" id="name-input" maxlength="12"
          style="background:#120e0a;border:1px solid #5a4227;color:white;padding:4px 6px;border-radius:4px;font-size:11px;min-width:0;width:140px">
        <button class="shop-btn" onclick="saveName()">Save</button>
      </div>

      <div class="equip-grid">
        <div class="equip-slot" id="equip-head" onclick="unequipItem('head')">
          <span class="slot-label">Head</span>
        </div>
        <div class="equip-slot" id="equip-weapon" onclick="unequipItem('weapon')">
          <span class="slot-label">Weapon</span>
        </div>
        <div class="equip-slot" id="equip-shield" onclick="unequipItem('shield')">
          <span class="slot-label">Shield</span>
        </div>
      </div>

      <div id="stat-points-label"
        style="font-weight:bold;color:#f0c868;margin-bottom:8px">
        Stat Points: 0
      </div>

      <div id="stats-list">
        <div class="stat-row">
          <span>⚔️ Attack: <b id="stat-attack">1</b></span>
          <button class="stat-upgrade-btn" onclick="upgradeStat('attack')">+</button>
        </div>
        <div class="stat-row">
          <span>💪 Strength: <b id="stat-strength">1</b></span>
          <button class="stat-upgrade-btn" onclick="upgradeStat('strength')">+</button>
        </div>
        <div class="stat-row">
          <span>🛡️ Defense: <b id="stat-defense">1</b></span>
          <button class="stat-upgrade-btn" onclick="upgradeStat('defense')">+</button>
        </div>
        <div class="stat-row">
          <span>❤️ Hitpoints: <b id="stat-hitpoints">10</b></span>
          <button class="stat-upgrade-btn" onclick="upgradeStat('hitpoints')">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ui-window" id="inventory-win">
    <div class="ui-header" id="inventory-win-header">
      <span>Inventory (28)</span>
      <span class="ui-close" onclick="toggleWindow('inventory-win')">✕</span>
    </div>
    <div class="ui-body">
      <div class="grid-28" id="inventory-grid"></div>
    </div>
  </div>

  <div class="ui-window" id="shop-win">
    <div class="ui-header" id="shop-win-header">
      <span>Bob's General Store</span>
      <span class="ui-close" onclick="toggleWindow('shop-win')">✕</span>
    </div>
    <div class="ui-body">
      <div style="font-size:11px;color:#f0c868;margin-bottom:8px">
        Tap inventory items to SELL, or buy below:
      </div>
      <div id="shop-items-list"></div>
    </div>
  </div>

  <div id="chat-container">
    <div id="chat-messages">
      <div class="msg system">
        Head North to enter the Level 10+ Wilderness!
      </div>
    </div>
    <input type="text" id="chat-input" placeholder="Type message...">
  </div>
</div>

<script>
const TILE_PX = 32;
const MAP_SIZE = 90;

const state = {
  playerId: null,
  players: {},
  npcs: [],
  groundItems: [],
  shopStock: [],
  map: [],
  popups: []
};

// Original world layout retained.
// Moving the wilderness north requires a matching server update.
for (let y = 0; y < MAP_SIZE; y++) {
  const row = [];

  for (let x = 0; x < MAP_SIZE; x++) {
    let tile = 0;

    if (x === 22 || y === 22) tile = 1;

    if (x >= 32 && x <= 40 && y >= 12 && y <= 18) {
      const wall = x === 32 || x === 40 || y === 12 || y === 18;
      tile = wall ? ((x === 36 && y === 18) ? 3 : 4) : 3;
    }

    if (y > 45) tile = 5;

    row.push(tile);
  }

  state.map.push(row);
}

const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
const host = location.host || 'localhost:8080';
const socket = new WebSocket(protocol + host);

function send(data) {
  if (socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(data));
  }
}

socket.onopen = () => {
  const status = document.getElementById('connection-status');
  status.innerText = '● Connected';
  status.style.color = '#00ff88';
};

socket.onclose = () => {
  const status = document.getElementById('connection-status');
  status.innerText = '● Closed';
  status.style.color = '#ff4444';
};

socket.onmessage = event => {
  try {
    const data = JSON.parse(event.data);

    if (data.type === 'INIT') {
      state.playerId = data.id;
      state.players = data.players || {};
      state.npcs = data.npcs || [];
      state.groundItems = data.groundItems || [];
      state.shopStock = data.shopStock || [];

      const me = state.players[state.playerId];
      if (me) document.getElementById('name-input').value = me.name;

      renderUI();
    } else if (data.type === 'TICK_UPDATE') {
      state.players = data.players || {};
      state.npcs = data.npcs || [];
      state.groundItems = data.groundItems || [];

      const me = state.players[state.playerId];

      if (me) {
        document.getElementById('player-name-hud').innerText = me.name;
        document.getElementById('player-stats-hud').innerText =
          `Lvl: ${me.combatLvl} | HP: ${me.hp}/${me.maxHp} | XP: ${me.xp}`;

        renderUI();
      }
    } else if (data.type === 'GROUND_UPDATE') {
      state.groundItems = data.groundItems || [];
    } else if (data.type === 'HITSPLAT') {
      spawnPopup(data.text, data.x, data.y, data.color);
    } else if (data.type === 'SERVER_MSG') {
      addChat(data.text, 'system');
    } else if (data.type === 'CHAT_MSG') {
      addChat(`${data.sender}: ${data.text}`);
    }
  } catch (err) {
    console.error('Could not process server message:', err);
  }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  ctx.imageSmoothingEnabled = false;
}

addEventListener('resize', resizeCanvas);
resizeCanvas();

function goFullscreen() {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }

  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}

function toggleWindow(id) {
  document.getElementById(id).classList.toggle('active');
}

function saveName() {
  const name = document.getElementById('name-input').value.trim();

  if (name) {
    send({ type: 'SET_NAME', name });
    addChat(`Character name updated to ${name}`, 'system');
  }
}

function upgradeStat(stat) {
  send({ type: 'UPGRADE_STAT', stat });
}

function unequipItem(slotName) {
  send({ type: 'UNEQUIP_ITEM', slotName });
}

function renderUI() {
  const me = state.players[state.playerId];
  if (!me) return;

  document.getElementById('stat-points-label').innerText =
    `Stat Points: ${me.statPoints}`;

  ['attack', 'strength', 'defense', 'hitpoints'].forEach(stat => {
    document.getElementById('stat-' + stat).innerText = me.stats[stat];
  });

  ['head', 'weapon', 'shield'].forEach(slot => {
    const el = document.getElementById('equip-' + slot);
    const item = me.equipment[slot];

    el.replaceChildren();

    const label = document.createElement('span');
    label.className = 'slot-label';
    label.textContent = slot.charAt(0).toUpperCase() + slot.slice(1);
    el.appendChild(label);

    if (item) {
      const icon = document.createElement('span');
      icon.className = 'item-icon';
      icon.textContent = item.icon;
      el.appendChild(icon);
    }
  });

  const grid = document.getElementById('inventory-grid');
  grid.replaceChildren();

  me.inventory.forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'inv-slot';

    if (item) {
      const icon = document.createElement('span');
      icon.className = 'item-icon';
      icon.textContent = item.icon;
      el.appendChild(icon);
      el.title = item.name;

      if (item.count > 1) {
        const count = document.createElement('span');
        count.className = 'item-count';
        count.textContent = item.count;
        el.appendChild(count);
      }

      el.onclick = () => {
        if (document.getElementById('shop-win').classList.contains('active')) {
          send({ type: 'SELL_ITEM', slotIndex: index });
        } else if (item.slot) {
          send({ type: 'EQUIP_ITEM', slotIndex: index });
        }
      };
    }

    grid.appendChild(el);
  });

  const shop = document.getElementById('shop-items-list');
  shop.replaceChildren();

  state.shopStock.forEach(item => {
    const row = document.createElement('div');
    row.className = 'shop-item-row';

    const label = document.createElement('span');
    label.textContent = `${item.icon} ${item.name} (${item.buyPrice}g)`;

    const button = document.createElement('button');
    button.className = 'shop-btn';
    button.textContent = 'Buy';
    button.onclick = () => send({ type: 'BUY_ITEM', itemId: item.id });

    row.append(label, button);
    shop.appendChild(row);
  });
}

let topZIndex = 25;

function bringToFront(el) {
  el.style.zIndex = ++topZIndex;
}

function makeDraggable(el, header) {
  let lastX = 0;
  let lastY = 0;

  function move(x, y) {
    el.style.left = (el.offsetLeft + x - lastX) + 'px';
    el.style.top = (el.offsetTop + y - lastY) + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    lastX = x;
    lastY = y;
  }

  header.addEventListener('pointerdown', event => {
    if (event.target.closest('.ui-close')) return;

    event.preventDefault();
    lastX = event.clientX;
    lastY = event.clientY;
    bringToFront(el);
    header.setPointerCapture(event.pointerId);
  });

  header.addEventListener('pointermove', event => {
    if (header.hasPointerCapture(event.pointerId)) {
      move(event.clientX, event.clientY);
    }
  });

  header.addEventListener('pointerup', event => {
    if (header.hasPointerCapture(event.pointerId)) {
      header.releasePointerCapture(event.pointerId);
    }
  });
}

['char-win', 'inventory-win', 'shop-win'].forEach(id => {
  makeDraggable(
    document.getElementById(id),
    document.getElementById(id + '-header')
  );
});

const joystickContainer = document.getElementById('joystick-container');
const joystickKnob = document.getElementById('joystick-knob');

let joystickActive = false;
let joystickInterval = null;
let joystickPointerId = null;
let joyAngle = 0;
const maxRadius = 30;

function updateJoystick(x, y) {
  const rect = joystickContainer.getBoundingClientRect();

  let dx = x - rect.left - rect.width / 2;
  let dy = y - rect.top - rect.height / 2;
  const distance = Math.hypot(dx, dy);

  if (distance > maxRadius) {
    dx = dx / distance * maxRadius;
    dy = dy / distance * maxRadius;
  }

  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyAngle = Math.atan2(dy, dx);
}

function sendJoystickMove() {
  const me = state.players[state.playerId];
  if (!joystickActive || !me) return;

  send({
    type: 'MOVE',
    x: Math.round(me.x + Math.cos(joyAngle) * 2),
    y: Math.round(me.y + Math.sin(joyAngle) * 2)
  });
}

function endJoystick() {
  joystickActive = false;
  joystickPointerId = null;
  joystickKnob.style.transform = 'translate(0px, 0px)';

  clearInterval(joystickInterval);
  joystickInterval = null;
}

joystickContainer.addEventListener('pointerdown', event => {
  if (joystickPointerId !== null) return;

  event.preventDefault();
  joystickPointerId = event.pointerId;
  joystickActive = true;
  joystickContainer.setPointerCapture(event.pointerId);

  updateJoystick(event.clientX, event.clientY);
  sendJoystickMove();

  joystickInterval = setInterval(sendJoystickMove, 120);
});

joystickContainer.addEventListener('pointermove', event => {
  if (event.pointerId === joystickPointerId) {
    updateJoystick(event.clientX, event.clientY);
  }
});

joystickContainer.addEventListener('pointerup', event => {
  if (event.pointerId === joystickPointerId) endJoystick();
});

joystickContainer.addEventListener('pointercancel', endJoystick);
joystickContainer.addEventListener('lostpointercapture', endJoystick);
addEventListener('blur', endJoystick);

canvas.addEventListener('click', event => {
  const me = state.players[state.playerId];
  if (!me) return;

  const rect = canvas.getBoundingClientRect();

  const worldX =
    (event.clientX - rect.left + me.x * TILE_PX - canvas.width / 2) / TILE_PX;

  const worldY =
    (event.clientY - rect.top + me.y * TILE_PX - canvas.height / 2) / TILE_PX;

  const ground = state.groundItems.find(item =>
    Math.hypot(item.x - worldX, item.y - worldY) < .8
  );

  if (ground) {
    send({ type: 'PICKUP', itemId: ground.id });
    return;
  }

  const npc = state.npcs.find(n =>
    n.alive && Math.hypot(n.x - worldX, n.y - worldY) < 1
  );

  if (npc) {
    if (npc.type === 'shopkeeper') {
      document.getElementById('shop-win').classList.add('active');
      document.getElementById('inventory-win').classList.add('active');
      addChat("Opened Bob's General Store!", 'system');
    } else {
      send({ type: 'ATTACK', targetId: npc.id });
    }

    return;
  }

  send({
    type: 'MOVE',
    x: Math.floor(worldX),
    y: Math.floor(worldY)
  });
});

document.getElementById('chat-input').addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.value.trim()) {
    send({ type: 'CHAT', text: event.target.value.trim() });
    event.target.value = '';
  }
});

function addChat(text, type = '') {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');

  div.className = `msg ${type}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function spawnPopup(text, x, y, color) {
  state.popups.push({ text, x, y, color, alpha: 1, offsetY: 0 });
}

// Pixel-art palette. Dots in sprite rows are transparent.
const SPRITE_PALETTE = {
  o: '#12151c',
  s: '#53667a',
  m: '#8fa5b8',
  h: '#d9e7ed',
  b: '#315c98',
  B: '#183455',
  r: '#963d47',

// Cache sprites on small offscreen canvases.
const spriteCache = new Map();

function getSpriteImage(name, variant = '') {
  const key = name + ':' + variant;

  if (spriteCache.has(key)) return spriteCache.get(key);

  const rows = PIXEL_SPRITES[name];
  const image = document.createElement('canvas');

  image.width = 16;
  image.height = 20;

  const paint = image.getContext('2d');
  const palette = { ...SPRITE_PALETTE };

  if (variant === 'other-player') {
    palette.b = '#963d47';
    palette.B = '#492431';
  }

  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const color = palette[row[x]];
      if (!color) continue;

      paint.fillStyle = color;
      paint.fillRect(x, y, 1, 1);
    }
  });

  spriteCache.set(key, image);
  return image;
}

function drawPixelSprite(x, y, name, scale = 2, variant = '') {
  const image = getSpriteImage(name, variant);
  const width = image.width * scale;
  const height = image.height * scale;
  const left = Math.round(x + 16 - width / 2);
  const top = Math.round(y + 30 - height);

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = 'rgba(0,0,0,.3)';

  const shadowWidth = scale === 3 ? 32 : 22;

  ctx.fillRect(
    Math.round(x + 16 - shadowWidth / 2),
    Math.round(y + 28),
    shadowWidth,
    4
  );

  ctx.drawImage(image, left, top, width, height);
  ctx.restore();
}

function drawPlayerSprite(x, y, isMe, isAttacking) {
  drawPixelSprite(x, y, 'hero', 2, isMe ? '' : 'other-player');

  if (isAttacking) {
    ctx.save();
    ctx.translate(Math.round(x + 27), Math.round(y + 11));

    ctx.fillStyle = '#12151c';
    ctx.fillRect(0, -2, 20, 6);

    ctx.fillStyle = '#8fa5b8';
    ctx.fillRect(2, -1, 17, 4);

    ctx.fillStyle = '#e5edf3';
    ctx.fillRect(2, -1, 17, 1);

    ctx.fillStyle = '#d7b45b';
    ctx.fillRect(0, -4, 3, 10);

    ctx.restore();
  }
}

function drawGoblinSprite(x, y) {
  drawPixelSprite(x, y, 'goblin');
}

function drawLevel10EnemySprite(x, y, name) {
  if (name.includes('Giant')) {
    drawPixelSprite(x, y, 'giant', 3);
  } else if (name.includes('Warrior')) {
    drawPixelSprite(x, y, 'warrior');
  } else {
    drawPixelSprite(x, y, 'brute');
  }
}

function drawShopkeeperSprite(x, y) {
  drawPixelSprite(x, y, 'shopkeeper');
}

function drawHealthBar(x, y, width, hp, maxHp, color) {
  const fraction = maxHp > 0 ? Math.max(0, Math.min(1, hp / maxHp)) : 0;

  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, width, 4);

  ctx.fillStyle = color;
  ctx.fillRect(x, y, width * fraction, 4);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let camX = 22 * TILE_PX - canvas.width / 2;
  let camY = 22 * TILE_PX - canvas.height / 2;

  const me = state.players[state.playerId];

  if (me) {
    camX = me.x * TILE_PX - canvas.width / 2;
    camY = me.y * TILE_PX - canvas.height / 2;
  }

  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const sx = x * TILE_PX - camX;
      const sy = y * TILE_PX - camY;

      if (
        sx < -TILE_PX || sx > canvas.width ||
        sy < -TILE_PX || sy > canvas.height
      ) continue;

      const tile = state.map[y][x];

      ctx.fillStyle =
        tile === 5 ? '#1c1917' :
        tile === 4 ? '#475569' :
        tile === 3 ? '#78350f' :
        tile === 1 ? '#57422a' :
        '#14532d';

      ctx.fillRect(sx, sy, TILE_PX, TILE_PX);

      if (tile === 5 || tile === 4 || tile === 3) {
        ctx.strokeStyle =
          tile === 5 ? '#292524' :
          tile === 4 ? '#1e293b' :
          '#451a03';

        ctx.strokeRect(sx, sy, TILE_PX, TILE_PX);
      }
    }
  }

  const signX = 22 * TILE_PX - camX - 24;
  const signY = 46 * TILE_PX - camY;

  ctx.fillStyle = '#1c1917';
  ctx.fillRect(signX, signY, 80, 20);
  ctx.strokeStyle = '#ef4444';
  ctx.strokeRect(signX, signY, 80, 20);
  ctx.font = 'bold 8px sans-serif';
  ctx.fillStyle = '#ef4444';
  ctx.fillText('⚠️ DANGER: LVL 10+', signX + 4, signY + 13);

  const shopSignX = 36 * TILE_PX - camX - 16;
  const shopSignY = 11 * TILE_PX - camY;

  ctx.fillStyle = '#3a2e1e';
  ctx.fillRect(shopSignX, shopSignY, 64, 18);
  ctx.strokeStyle = '#8c6a3c';
  ctx.strokeRect(shopSignX, shopSignY, 64, 18);
  ctx.font = 'bold 8px sans-serif';
  ctx.fillStyle = '#f3d078';
  ctx.fillText("BOB'S SHOP", shopSignX + 4, shopSignY + 12);

  state.groundItems.forEach(item => {
    const sx = item.x * TILE_PX - camX;
    const sy = item.y * TILE_PX - camY;

    ctx.font = '16px serif';
    ctx.fillText(item.icon, sx + 8, sy + 22);
  });

  state.npcs.forEach(npc => {
    if (!npc.alive) return;

    const sx = npc.x * TILE_PX - camX;
    const sy = npc.y * TILE_PX - camY;

    if (npc.type === 'shopkeeper') {
      drawShopkeeperSprite(sx, sy);

      ctx.font = 'bold 9px sans-serif';
      ctx.fillStyle = '#f0c868';
      ctx.fillText(npc.name, sx - 12, sy - 16);
    } else if (npc.level >= 10) {
      drawLevel10EnemySprite(sx, sy, npc.name);

      const giant = npc.name.includes('Giant');
      const barY = sy - (giant ? 36 : 16);

      drawHealthBar(sx, barY, 32, npc.hp, npc.maxHp, '#ef4444');

      ctx.font = 'bold 9px sans-serif';
      ctx.fillStyle = '#fca5a5';
      ctx.fillText(
        `${npc.name} (Lvl ${npc.level})`,
        sx - 8,
        sy - (giant ? 42 : 22)
      );
    } else {
      drawGoblinSprite(sx, sy);
      drawHealthBar(sx + 2, sy - 16, 28, npc.hp, npc.maxHp, '#22c55e');

      ctx.font = 'bold 9px sans-serif';
      ctx.fillStyle = '#f87171';
      ctx.fillText(`${npc.name} (Lvl ${npc.level})`, sx - 6, sy - 22);
    }
  });

  Object.values(state.players).forEach(player => {
    const sx = player.x * TILE_PX - camX;
    const sy = player.y * TILE_PX - camY;
    const isMe = player.id === state.playerId;

    drawPlayerSprite(sx, sy, isMe, player.isAttacking);

    ctx.font = 'bold 10px sans-serif';
    ctx.fillStyle = isMe ? '#facc15' : '#38bdf8';
    ctx.fillText(player.name, sx - 6, sy - 18);
  });

  for (let index = state.popups.length - 1; index >= 0; index--) {
    const popup = state.popups[index];
    const sx = popup.x * TILE_PX - camX + 8;
    const sy = popup.y * TILE_PX - camY - popup.offsetY;

    ctx.save();
    ctx.globalAlpha = Math.max(0, popup.alpha);
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = popup.color;
    ctx.fillText(popup.text, sx, sy);
    ctx.restore();

    popup.offsetY += .5;
    popup.alpha -= .025;

    if (popup.alpha <= 0) {
      state.popups.splice(index, 1);
    }
  }

  requestAnimationFrame(draw);
}
