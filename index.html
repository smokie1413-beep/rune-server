<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RuneQuest 2D — Northern Wilderness</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Cinzel', 'Trebuchet MS', sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0b0d;
  color: white;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: #151d18;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  touch-action: none;
}

#top-bar {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
  z-index: 10;
}

.hud-badge {
  pointer-events: auto;
  background: rgba(18, 16, 12, .92);
  border: 2px solid #5d462b;
  border-radius: 6px;
  padding: 6px 10px;
  box-shadow: 0 4px 10px #0008;
}

#player-name-hud {
  color: #f0c868;
  font-size: 12px;
  font-weight: bold;
}

#player-stats-hud {
  color: #00ffcc;
  font-size: 10px;
}

#region-hud {
  color: #d9c899;
  font-size: 10px;
  margin-top: 4px;
}

#connection-status {
  font-size: 11px;
  color: #ffaa00;
}

.btn-fullscreen {
  pointer-events: auto;
  background: linear-gradient(#b91c1c, #7f1d1d);
  border: 2px solid #f87171;
  border-radius: 6px;
  color: white;
  padding: 6px 10px;
  font-size: 11px;
  cursor: pointer;
}

#joystick-container {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #0007;
  border: 2px solid #8c6a3c;
  touch-action: none;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(4px);
}

#joystick-knob {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle, #8c6a3c, #3a2e1e);
  border: 2px solid #f3d078;
  pointer-events: none;
  box-shadow: 0 4px 8px #0008;
}

#hud-tabs {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 20;
}

.tab-btn {
  width: 46px;
  height: 46px;
  background: linear-gradient(#3a2e1e, #1a140d);
  border: 2px solid #8c6a3c;
  border-radius: 8px;
  color: #f3d078;
  font-size: 20px;
  cursor: pointer;
}

.ui-window {
  position: absolute;
  width: 290px;
  max-width: calc(100vw - 20px);
  max-height: min(420px, calc(100vh - 90px));
  background: rgba(22, 18, 13, .97);
  border: 3px solid #6b5233;
  border-radius: 10px;
  box-shadow: 0 8px 24px #000b;
  display: none;
  flex-direction: column;
  z-index: 25;
  overflow: hidden;
}

.ui-window.active {
  display: flex;
}

#char-win { bottom: 76px; right: 20px; }
#inventory-win { bottom: 76px; right: 320px; }
#shop-win { bottom: 76px; right: 620px; }

.ui-header {
  background: linear-gradient(90deg, #3d2d1b, #1e150b);
  padding: 8px 12px;
  border-bottom: 2px solid #5a4227;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #f8db83;
  font-size: 13px;
  cursor: move;
  touch-action: none;
}
