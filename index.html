<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RuneQuest 2D - Web Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Cinzel', 'Trebuchet MS', sans-serif; }
  body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0b0d; color: #fff; }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    background: #151d18;
  }

  /* Top Bar Header */
  #top-bar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }

  .hud-badge {
    pointer-events: auto;
    background: rgba(18, 16, 12, 0.85);
    border: 2px solid #5d462b;
    border-radius: 6px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
  }

  /* Side HUD Tabs for Mobile Landscape */
  #hud-tabs {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
  }

  .tab-btn {
    width: 48px;
    height: 48px;
    background: linear-gradient(180deg, #3a2e1e 0%, #1a140d 100%);
    border: 2px solid #8c6a3c;
    border-radius: 8px;
    color: #f3d078;
    font-size: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
  }

  .tab-btn:active, .tab-btn.active {
    transform: scale(0.95);
    border-color: #ffd700;
  }

  /* UI Windows */
  .ui-window {
    position: absolute;
    bottom: 68px;
    right: 12px;
    width: 310px;
    max-height: 420px;
    background: rgba(22, 18, 13, 0.94);
    border: 3px solid #6b5233;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    display: none
