/**
 * Fullscreen API & Mobile Landscape Orientation Toggle
 */
function toggleFullScreen() {
  const elem = document.documentElement;
  const fsBtnLabel = document.getElementById('fs-label');
  const fsBtnIcon = document.getElementById('fs-icon');

  if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    } else if (elem.mozRequestFullScreen) {
      elem.mozRequestFullScreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
    }
    
    // Request Landscape Lock on supported mobile devices
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    if (fsBtnLabel) fsBtnLabel.innerText = "Exit";
    if (fsBtnIcon) fsBtnIcon.innerText = "🗗";
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    
    if (fsBtnLabel) fsBtnLabel.innerText = "Fullscreen";
    if (fsBtnIcon) fsBtnIcon.innerText = "⛶";
  }
}

document.addEventListener('fullscreenchange', handleFSChange);
document.addEventListener('webkitfullscreenchange', handleFSChange);
document.addEventListener('mozfullscreenchange', handleFSChange);

function handleFSChange() {
  const fsBtnLabel = document.getElementById('fs-label');
  const fsBtnIcon = document.getElementById('fs-icon');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (fsBtnLabel) fsBtnLabel.innerText = "Exit";
    if (fsBtnIcon) fsBtnIcon.innerText = "🗗";
  } else {
    if (fsBtnLabel) fsBtnLabel.innerText = "Fullscreen";
    if (fsBtnIcon) fsBtnIcon.innerText = "⛶";
  }
}
